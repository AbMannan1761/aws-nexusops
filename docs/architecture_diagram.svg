<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" height="100%" style="background:#090d16; font-family:'Segoe UI', -apple-system, sans-serif;">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Title & Header -->
  <text x="50" y="48" fill="#f8fafc" font-size="24" font-weight="700" letter-spacing="-0.5">AWS NexusOps Architecture</text>
  <text x="50" y="74" fill="#94a3b8" font-size="14">Autonomous Omnichannel Enterprise Concierge &bull; Amazon Bedrock AgentCore &amp; AWS CDS</text>

  <!-- Channel Column 1: Client Channels -->
  <rect x="50" y="110" width="220" height="520" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
  <text x="75" y="145" fill="#f8fafc" font-size="16" font-weight="600">Client / Field Channels</text>
  <line x1="75" y1="160" x2="245" y2="160" stroke="#334155" stroke-width="1" />

  <!-- WhatsApp Box -->
  <rect x="70" y="180" width="180" height="85" rx="10" fill="#111827" stroke="#22c55e" stroke-width="1.5" />
  <circle cx="95" cy="205" r="12" fill="#22c55e" />
  <text x="120" y="210" fill="#f8fafc" font-size="13" font-weight="600">WhatsApp Mobile</text>
  <text x="85" y="235" fill="#94a3b8" font-size="11">Field Engineers &amp; Clients</text>
  <text x="85" y="250" fill="#4ade80" font-size="10">EUM Social Ingress</text>

  <!-- Stakeholder Email Box -->
  <rect x="70" y="285" width="180" height="85" rx="10" fill="#111827" stroke="#38bdf8" stroke-width="1.5" />
  <circle cx="95" cy="310" r="12" fill="#38bdf8" />
  <text x="120" y="315" fill="#f8fafc" font-size="13" font-weight="600">Executive Email</text>
  <text x="85" y="340" fill="#94a3b8" font-size="11">Stakeholder Audit Lists</text>
  <text x="85" y="355" fill="#38bdf8" font-size="10">SES HTML Digests</text>

  <!-- Mobile SMS Box -->
  <rect x="70" y="390" width="180" height="85" rx="10" fill="#111827" stroke="#fbbf24" stroke-width="1.5" />
  <circle cx="95" cy="415" r="12" fill="#fbbf24" />
  <text x="120" y="420" fill="#f8fafc" font-size="13" font-weight="600">Mobile SMS Device</text>
  <text x="85" y="445" fill="#94a3b8" font-size="11">Urgent OTP / Alerts</text>
  <text x="85" y="460" fill="#fbbf24" font-size="10">Pinpoint SMS v2</text>

  <!-- Web Console Box -->
  <rect x="70" y="495" width="180" height="85" rx="10" fill="#111827" stroke="#a855f7" stroke-width="1.5" />
  <circle cx="95" cy="520" r="12" fill="#a855f7" />
  <text x="120" y="525" fill="#f8fafc" font-size="13" font-weight="600">Operations Console</text>
  <text x="85" y="550" fill="#94a3b8" font-size="11">Command Center Web UI</text>
  <text x="85" y="565" fill="#c084fc" font-size="10">Trace Inspector</text>

  <!-- Connector from Channels to Brain -->
  <path d="M 250 220 L 370 330" stroke="#22c55e" stroke-width="2" stroke-dasharray="4,4" />
  <path d="M 250 535 L 370 370" stroke="#a855f7" stroke-width="2" stroke-dasharray="4,4" />

  <!-- Core Brain: Amazon Bedrock AgentCore -->
  <rect x="370" y="110" width="340" height="520" rx="16" fill="url(#cardGrad)" stroke="#7c3aed" stroke-width="2" filter="url(#glow)" />
  <rect x="390" y="130" width="300" height="40" rx="8" fill="url(#purpleGrad)" />
  <text x="440" y="156" fill="#ffffff" font-size="15" font-weight="700">Amazon Bedrock AgentCore</text>

  <!-- Inner Agent Core Modules -->
  <rect x="390" y="185" width="300" height="95" rx="10" fill="#090d16" stroke="#475569" stroke-width="1" />
  <text x="410" y="210" fill="#f8fafc" font-size="13" font-weight="600">Cognitive Reasoning Engine</text>
  <text x="410" y="230" fill="#94a3b8" font-size="11">&bull; Model: Anthropic Claude 3.5 Sonnet</text>
  <text x="410" y="248" fill="#94a3b8" font-size="11">&bull; Multi-turn Converse ReAct Loop</text>
  <text x="410" y="266" fill="#a855f7" font-size="11">&bull; Real-time Trace &amp; Intent Classifier</text>

  <rect x="390" y="295" width="300" height="150" rx="10" fill="#090d16" stroke="#475569" stroke-width="1" />
  <text x="410" y="320" fill="#f8fafc" font-size="13" font-weight="600">Autonomous Tool Orchestrator</text>
  
  <rect x="405" y="335" width="270" height="26" rx="6" fill="#1e293b" />
  <text x="415" y="352" fill="#4ade80" font-size="11" font-weight="600">Tool: send_whatsapp_message</text>

  <rect x="405" y="367" width="270" height="26" rx="6" fill="#1e293b" />
  <text x="415" y="384" fill="#38bdf8" font-size="11" font-weight="600">Tool: send_ses_audit_email</text>

  <rect x="405" y="399" width="270" height="26" rx="6" fill="#1e293b" />
  <text x="415" y="416" fill="#fbbf24" font-size="11" font-weight="600">Tool: send_sms_urgent_alert</text>

  <rect x="390" y="460" width="300" height="145" rx="10" fill="#090d16" stroke="#475569" stroke-width="1" />
  <text x="410" y="485" fill="#f8fafc" font-size="13" font-weight="600">Memory &amp; Operational Store</text>
  <text x="410" y="508" fill="#94a3b8" font-size="11">&bull; Amazon DynamoDB Sessions &amp; Tickets</text>
  <text x="410" y="528" fill="#94a3b8" font-size="11">&bull; Full Audit Trail &amp; Delivery Telemetry</text>
  <text x="410" y="548" fill="#94a3b8" font-size="11">&bull; Automated Escalation Protocols</text>
  <text x="410" y="575" fill="#34d399" font-size="11" font-weight="600">&bull; Status: Real-time Synchronized</text>

  <!-- Connectors from Brain to AWS CDS -->
  <path d="M 690 348 L 780 220" stroke="#22c55e" stroke-width="2.5" />
  <path d="M 690 380 L 780 340" stroke="#38bdf8" stroke-width="2.5" />
  <path d="M 690 412 L 780 460" stroke="#fbbf24" stroke-width="2.5" />

  <!-- Column 3: AWS CDS Services (Strictly Meeting Hackathon Rules) -->
  <rect x="780" y="110" width="270" height="520" rx="16" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" />
  <text x="805" y="145" fill="#f8fafc" font-size="16" font-weight="600">AWS CDS Runtime Layer</text>
  <line x1="805" y1="160" x2="1025" y2="160" stroke="#334155" stroke-width="1" />

  <!-- CDS Service 1: WhatsApp -->
  <rect x="800" y="180" width="230" height="105" rx="10" fill="#111827" stroke="#22c55e" stroke-width="1.5" />
  <text x="815" y="205" fill="#22c55e" font-size="13" font-weight="700">AWS EUM Social (WhatsApp)</text>
  <text x="815" y="225" fill="#cbd5e1" font-size="11">SDK: boto3 socialmessaging</text>
  <text x="815" y="243" fill="#cbd5e1" font-size="11">API: SendWhatsAppMessage</text>
  <text x="815" y="265" fill="#86efac" font-size="10">&bull; Eligible for Meta $10k Prize</text>

  <!-- CDS Service 2: SES v2 -->
  <rect x="800" y="300" width="230" height="105" rx="10" fill="#111827" stroke="#38bdf8" stroke-width="1.5" />
  <text x="815" y="325" fill="#38bdf8" font-size="13" font-weight="700">Amazon SES (Email v2)</text>
  <text x="815" y="345" fill="#cbd5e1" font-size="11">SDK: boto3 sesv2</text>
  <text x="815" y="363" fill="#cbd5e1" font-size="11">API: send_email</text>
  <text x="815" y="385" fill="#7dd3fc" font-size="10">&bull; Rich HTML Executive Digests</text>

  <!-- CDS Service 3: SMS v2 -->
  <rect x="800" y="420" width="230" height="105" rx="10" fill="#111827" stroke="#fbbf24" stroke-width="1.5" />
  <text x="815" y="445" fill="#fbbf24" font-size="13" font-weight="700">AWS EUM (SMS &amp; RCS)</text>
  <text x="815" y="465" fill="#cbd5e1" font-size="11">SDK: boto3 pinpoint-sms-voice-v2</text>
  <text x="815" y="483" fill="#cbd5e1" font-size="11">API: SendTextMessage</text>
  <text x="815" y="505" fill="#fde68a" font-size="10">&bull; Critical Priority 2FA / Broadcast</text>

  <rect x="800" y="540" width="230" height="65" rx="10" fill="#111827" stroke="#334155" stroke-width="1" />
  <text x="815" y="565" fill="#94a3b8" font-size="11">Infrastructure Provisioning</text>
  <text x="815" y="585" fill="#cbd5e1" font-size="11">AWS CDK &bull; CloudFormation</text>

</svg>
